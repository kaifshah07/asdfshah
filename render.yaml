services:
  - type: web
    name: gridbricks-backend
    env: python
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install --no-cache-dir -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
    healthCheckPath: /health
