# ==============================================================================
# Gridbricks Full-Stack Application - Docker Compose Orchestration
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gridbricks-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - gridbricks-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: gridbricks-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gridbricks-net

networks:
  gridbricks-net:
    driver: bridge
